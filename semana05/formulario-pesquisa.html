<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>
<body>
    <header>
        <h1>WDD  130 | Formulário HTML - Pesquisa de Usuário</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Informações de Contato</legend>
                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>
                <div class="item-formulario coluna2">
                    <label for="email-do-usuario">E-mail:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Perguntas</legend>
                <div class="item-formulario coluna1">
                <label for="navegador">Qual seu navegador favorito?</label>
                <select name="navegador" id="navegador">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
                </div>
                <div class="item-formulario coluna1">
                <label for="pet">Você tem um Bichinho de estimação?</label>
                <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="item-formulario lugares">
                <label for="feedback">Liste os lugares onde você morou</label>
                <textarea name="feedback" id="feedback" rows="4" placeholder="Stillwater Flórida, Amsterdã Holanda, Tibuktu Mali"></textarea>
                </div>
            </fieldset>
            <button type="submit">Enviar Pesquisa</button>
            

        </form>

    </main>
    <footer>
        <p>© 2026 | Formulário HTML - Pesquisa de Usuário | Amanda de Souza Silva</p>
    </footer>
</body>
</html>
